<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chapter 8 Lab 1</title>
        <link rel="stylesheet" href="ch8lab.css">
    </head>
    <body>
        <h1>Florence to Rome</h1>
        <table>
            <caption>Looking at the costs</caption>
            <thead>
                <th scope="col">Mode of Travel</th>
                <th scope="col">Cost (USD)</th>
                <th scope="col">Duration (hours)</th>
                <th scope="col">Comfort Rating</th>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Train</td>
                    <td class="numeric">$30</td>
                    <td class="numeric">2.5</td>
                    <td>6/10</td>
                </tr>
                <tr>
                    <th scope="row">Bus</td>
                    <td class="numeric">N/A</td>
                    <td class="numeric">N/A</td>
                    <td>N/A</td>
                </tr>
                <tr>
                    <th scope="row">Plane</td>
                    <td class="numeric">$140</td>
                    <td class="numeric">1</td>
                    <td>5/10</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th scope="row" colspan="3">Average Cost</th>
                    <td>$85</td>
                </tr>
            </tfoot>
        </table>
        <p><em>Costs are in USD</em></p>
    </body>
</html>
