<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Travel Budget</title>
    </head>

    <body>
        <h1>Travel Budget Planner</h1>
        <table>
            <thead>
                <tr>
                    <th>Destination</th>
                    <th>Accommodation</th>
                    <th>Food</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Rome</td>
                    <td>$700</td>
                    <td>$300</td>
                    <td>$1000</td>
                </tr>
                <tr>
                    <td>Paris</td>
                    <td>$800</td>
                    <td>$350</td>
                    <td>$1150</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3"><strong>Overall Budget</strong></td>
                    <td><strong>$2150</strong></td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
